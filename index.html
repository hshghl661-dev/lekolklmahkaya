<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="day">
<head>
<meta charset="UTF-8">

<meta property="og:type" content="website">
<meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFF4E8'/%3E%3Cpath d='M10 42c6-3.4 14-3.4 22 1 8-4.4 16-4.4 22-1v12c-6-3.4-14-3.4-22 1-8-4.4-16-4.4-22-1z' fill='%23FFFDF8' stroke='%23C9A24B' stroke-width='1.6'/%3E%3C/svg%3E">

<style>
/* ============================================================
   1) المتغيرات والسمات
============================================================ */
:root{
  --bg:#FFF9F1; --bg2:#FFF4E8; --surface:#FFFDF9; --surface2:#FFF8EE;
  --ink:#5C4A3E; --muted:#8A7566; --line:rgba(201,162,75,.18);
  --accent:#E88AA5; --accent-deep:#D96B8F;
  --gold:#C9A24B; --gold-soft:#EAD9A8;
  --pink:#F7CAD6; --peach:#FFD9C2; --sky:#D6EAFB; --mint:#DDF3E4; --lav:#E9E4FA; --butter:#FBF0C8;
  --ok:#5FB884; --warn:#D99A3D; --err:#D96B6B;
  --shadow:0 14px 34px -16px rgba(150,110,70,.28);
  --shadow-lg:0 24px 50px -20px rgba(150,110,70,.35);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --font-head:'Amiri',serif; --font-body:'Tajawal',sans-serif; --font-logo:'Aref Ruqaa',serif;
}
[data-theme="night"]{
  --bg:#241C17; --bg2:#2B221C; --surface:#322820; --surface2:#3A2E25;
  --ink:#F4E9DB; --muted:#C8B29E; --line:rgba(255,214,170,.16);
  --shadow:0 14px 34px -16px rgba(0,0,0,.55);
  --shadow-lg:0 24px 50px -20px rgba(0,0,0,.6);
}
/* ============================================================
   2) أساسيات
============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.8;overflow-x:hidden;transition:background .4s,color .4s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px 400px at 85% -5%,rgba(247,202,214,.35),transparent 60%),
             radial-gradient(700px 500px at 5% 20%,rgba(214,234,251,.35),transparent 60%),
             radial-gradient(600px 500px at 50% 110%,rgba(223,243,228,.3),transparent 60%)}
[data-theme="night"] body::before{opacity:.35}
main,header,footer{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:1rem;color:var(--ink)}
img{max-width:100%}
::selection{background:var(--gold-soft);color:#5C4A3E}
.container{width:min(1180px,92%);margin-inline:auto}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;line-height:1.5}
.icon{width:1.25em;height:1.25em;vertical-align:-.25em;flex:none}
/* ============================================================
   3) مكونات عامة
============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.72rem 1.6rem;border-radius:999px;font-weight:700;font-size:.95rem;border:1.5px solid transparent;transition:.25s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;box-shadow:0 10px 22px -10px var(--accent-deep)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 28px -12px var(--accent-deep)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-deep);transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,#E9CF8E,#C9A24B);color:#4A3413;box-shadow:0 10px 22px -10px #C9A24B}
.btn-gold:hover{transform:translateY(-2px)}
.btn-wa{background:linear-gradient(135deg,#7BD88F,#3EB86A);color:#fff;box-shadow:0 10px 22px -10px #3EB86A}
.btn-wa:hover{transform:translateY(-2px)}
.btn-danger{background:#FBEAEA;color:#C05555;border-color:#F0C9C9}
.btn-danger:hover{background:#F6DCDC}
.btn-sm{padding:.45rem 1.05rem;font-size:.85rem}
.btn-lg{padding:.95rem 2.2rem;font-size:1.05rem}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .85rem;border-radius:999px;font-size:.8rem;font-weight:700}
.chip-sky{background:var(--sky);color:#3A6E9E}.chip-pink{background:var(--pink);color:#B0526F}
.chip-mint{background:var(--mint);color:#3E7E5A}.chip-lav{background:var(--lav);color:#6A57B8}
.chip-butter{background:var(--butter);color:#9A7B1E}.chip-peach{background:var(--peach);color:#B06A35}
.chip-gold{background:#F6ECD2;color:#8A6B1E}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.input,textarea.input,select.input{width:100%;padding:.8rem 1.1rem;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);transition:.25s;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
label.f{display:block;font-size:.85rem;font-weight:700;margin:0 0 .35rem;color:var(--muted)}
.sec-head{text-align:center;margin-bottom:2.6rem}
.sec-tag{display:inline-block;padding:.25rem 1rem;border-radius:999px;background:linear-gradient(135deg,var(--gold-soft),#F6ECD2);color:#8A6B1E;font-size:.8rem;font-weight:800;letter-spacing:.5px;margin-bottom:.8rem}
.sec-title{font-size:clamp(1.7rem,4vw,2.5rem);color:var(--ink)}
.sec-sub{color:var(--muted);max-width:640px;margin:.4rem auto 0}
.orn{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:1rem;color:var(--gold)}
.orn::before,.orn::after{content:'';height:1.5px;width:70px;background:linear-gradient(90deg,transparent,var(--gold));border-radius:2px}
.orn::after{background:linear-gradient(90deg,var(--gold),transparent)}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.empty{padding:3.2rem 1.5rem;text-align:center;color:var(--muted)}
.empty .big{font-size:3rem;margin-bottom:.6rem}
/* ============================================================
   4) الشريط العلوي والقائمة
============================================================ */
#progress{position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold));z-index:200;width:0;transition:width .1s}
header#navbar{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:1rem;padding:.7rem 0}
.brand{display:flex;align-items:center;gap:.7rem}
.brand-t{display:flex;flex-direction:column;line-height:1.25}
.brand-t b{font-family:var(--font-logo);font-size:1.25rem;color:var(--ink)}
.brand-t small{font-size:.68rem;color:var(--muted);letter-spacing:.5px}
.nav-links{display:flex;gap:.2rem;margin-inline-start:auto}
.nav-links a{padding:.5rem .95rem;border-radius:999px;font-weight:500;font-size:.95rem;color:var(--muted);transition:.25s}
.nav-links a:hover{color:var(--accent-deep);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.nav-links a.on{color:var(--accent-deep);background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:700}
.nav-acts{display:flex;align-items:center;gap:.5rem}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);background:var(--surface);transition:.25s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-deep);transform:translateY(-2px)}
.burger{display:none}
/* القائمة الجانبية للجوال */
#overlay{position:fixed;inset:0;background:rgba(60,40,30,.35);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:150}
#overlay.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,84vw);background:var(--surface);z-index:160;transform:translateX(-108%);transition:transform .38s cubic-bezier(.22,.9,.3,1);padding:1.4rem;display:flex;flex-direction:column;gap:.3rem;box-shadow:var(--shadow-lg);border-right:1px solid var(--line)}
#drawer.on{transform:none}
#drawer .d-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
#drawer a.d-link{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;border-radius:14px;font-weight:500;color:var(--ink);transition:.2s}
#drawer a.d-link:hover{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent-deep)}
#drawer .d-sec{margin-top:auto;padding-top:1rem;border-top:1px dashed var(--line);display:flex;gap:.5rem}
/* ============================================================
   5) البطل (Hero)
============================================================ */
.hero{position:relative;padding:5.5rem 0 4.5rem;text-align:center;overflow:hidden}
.hero-logo{margin-bottom:1.2rem;animation:floaty 5s ease-in-out infinite}
.hero-title{font-size:clamp(2.6rem,7vw,4.6rem);color:var(--ink);letter-spacing:.5px}
.hero-title .grad{background:linear-gradient(120deg,var(--accent-deep),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{max-width:640px;margin:1rem auto 0;color:var(--muted);font-size:1.1rem}
.hero-cta{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}
.hero-stats{display:flex;gap:2.4rem;justify-content:center;margin-top:2.6rem;flex-wrap:wrap}
.hstat b{display:block;font-family:var(--font-head);font-size:1.9rem;color:var(--accent-deep)}
.hstat span{font-size:.85rem;color:var(--muted)}
.hero-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hd{position:absolute;opacity:.85;animation:floaty 6s ease-in-out infinite}
.scroll-ind{position:absolute;bottom:1.4rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.35rem;color:var(--muted);font-size:.8rem}
.mouse{width:26px;height:42px;border:2px solid var(--gold);border-radius:14px;display:flex;justify-content:center;padding-top:7px}
.wheel{width:4px;height:9px;border-radius:4px;background:var(--gold);animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(12px);opacity:0}100%{opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
/* ============================================================
   6) الشريط المتحرك (Marquee)
============================================================ */
.marquee{overflow:hidden;background:linear-gradient(90deg,var(--butter),var(--pink),var(--sky),var(--mint));border-block:1px solid var(--line);padding:.7rem 0;direction:ltr}
.mq-track{display:flex;gap:2.6rem;width:max-content;animation:mq 26s linear infinite}
.mq-track span{display:flex;align-items:center;gap:2.6rem;font-family:var(--font-head);font-size:1.05rem;color:#7A5A2E;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
/* ============================================================
   7) الأقسام والكتب
============================================================ */
section.block{padding:4.2rem 0}
.block.tint-sky{background:color-mix(in srgb,var(--sky) 30%,var(--bg))}
.block.tint-lav{background:color-mix(in srgb,var(--lav) 34%,var(--bg))}
.block.tint-mint{background:color-mix(in srgb,var(--mint) 32%,var(--bg))}
.block.tint-butter{background:color-mix(in srgb,var(--butter) 34%,var(--bg))}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.6rem}
.book-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);transition:.3s;display:flex;flex-direction:column}
.book-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg)}
.bc-cover{position:relative;padding:1rem 1rem 0}
.bc-body{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.bc-title{font-size:1.2rem;text-align:center}
.bc-meta{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap}
.bc-actions{display:flex;gap:.5rem;margin-top:auto;padding-top:.6rem}
.bc-actions .btn{flex:1}
.heart{position:absolute;top:1.5rem;inset-inline-end:1.5rem;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.25s;z-index:2;border:1px solid var(--line)}
.heart:hover{transform:scale(1.12);color:var(--accent-deep)}
.heart.on{color:#E05C7E;background:#FDECEF}
/* الأغلفة */
.cover{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 10px 22px -12px rgba(120,80,40,.4);border:1px solid rgba(201,162,75,.3)}
.cover::before{content:'';position:absolute;inset:9px;border:1.5px dashed rgba(255,255,255,.65);border-radius:12px;pointer-events:none}
.cover::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 12%,rgba(255,255,255,.5),transparent 42%),radial-gradient(rgba(255,255,255,.28) 1.2px,transparent 1.3px);background-size:auto,16px 16px;pointer-events:none}
.cover-inner{position:relative;z-index:1;text-align:center;padding:1.4rem 1rem;display:flex;flex-direction:column;gap:.5rem;align-items:center}
.cover-kicker{font-size:.62rem;letter-spacing:2px;color:rgba(255,255,255,.92);font-weight:700}
.cover-title{font-family:var(--font-head);font-size:1.45rem;color:#fff;text-shadow:0 2px 10px rgba(90,40,60,.25);line-height:1.55}
.cover-author{font-size:.72rem;color:rgba(255,255,255,.92)}
.cover-star{position:absolute;color:rgba(255,255,255,.85)}
.cv-rose{background:linear-gradient(160deg,#F7CAD6,#E88AA5 55%,#D96B8F)}
.cv-peach{background:linear-gradient(160deg,#FFE3D0,#F2A56F 55%,#E08A4C)}
.cv-sky{background:linear-gradient(160deg,#D6EAFB,#7FB6E4 55%,#5A97D4)}
.cv-mint{background:linear-gradient(160deg,#DDF3E4,#8FD0A8 55%,#5FB884)}
.cv-lav{background:linear-gradient(160deg,#E9E4FA,#B3A4E8 55%,#937FD8)}
.cv-butter{background:linear-gradient(160deg,#FBF0C8,#E8CE7E 55%,#C9A24B)}
/* تفاصيل الكتاب */
.bd-wrap{display:grid;grid-template-columns:320px 1fr;gap:2.6rem;align-items:start}
.bd-cover{position:sticky;top:96px}
.bd-info h1{font-size:2.3rem;margin-bottom:.4rem}
.bd-row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0}
.bd-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:1.2rem 1.4rem;margin-top:1rem}
.bd-actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.4rem}
.alert{display:flex;gap:.7rem;align-items:flex-start;border-radius:var(--r-md);padding:1rem 1.2rem;margin:1rem 0;border:1.5px solid;font-size:.95rem}
.alert-warn{background:#FFF6E0;border-color:#EFD9A0;color:#8A6B1E}
.alert-err{background:#FDECEC;border-color:#F2C0C0;color:#A04444}
.alert-ok{background:#E9F7EE;border-color:#C4E6CF;color:#3E7E5A}
[data-theme="night"] .alert-warn{background:#3A2F1A;color:#E8CE7E;border-color:#5A4A22}
[data-theme="night"] .alert-err{background:#3A2222;color:#F0A0A0;border-color:#5A2C2C}
[data-theme="night"] .alert-ok{background:#1E3328;color:#9BD8B0;border-color:#2C4A38}
/* القراءة */
.reader-bar{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
.reader-frame{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-lg);background:var(--surface)}
.reader-frame iframe{width:100%;height:78vh;border:0;display:block}
/* ============================================================
   8) الأقوال والفريق والعناصر الأدبية
============================================================ */
.qod{max-width:760px;margin:0 auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:3rem 2rem;box-shadow:var(--shadow);position:relative}
.qod .q-mark{font-family:var(--font-head);font-size:4rem;color:var(--gold);line-height:1;opacity:.5}
.qod blockquote{font-family:var(--font-head);font-size:clamp(1.4rem,3.4vw,2rem);line-height:1.9;color:var(--ink)}
.qod .q-src{margin-top:1.2rem;color:var(--muted);font-size:.9rem}
.quotes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.6rem}
.quote-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.8rem;box-shadow:var(--shadow);position:relative;transition:.3s}
.quote-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.quote-card p{font-family:var(--font-head);font-size:1.2rem;line-height:1.9}
.quote-card .q-src{margin-top:1rem;font-size:.82rem;color:var(--muted)}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.4rem}
.team-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.8rem 1.2rem;text-align:center;box-shadow:var(--shadow);transition:.3s}
.team-card:hover{transform:translateY(-6px)}
.team-card.owner{border-color:var(--gold);background:linear-gradient(180deg,#FFFDF6,var(--surface))}
.avatar{width:74px;height:74px;border-radius:50%;margin:0 auto .9rem;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:1.7rem;color:#fff;box-shadow:var(--shadow)}
.team-card .nm{font-weight:800;font-size:1.05rem;white-space:nowrap}
.team-card .rl{margin-top:.4rem}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.4rem;margin-top:2rem}
.value-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.8rem;text-align:center;box-shadow:var(--shadow)}
.value-card .vi{width:56px;height:56px;border-radius:18px;margin:0 auto .9rem;display:flex;align-items:center;justify-content:center}
/* ============================================================
   9) النماذج والمصادقة
============================================================ */
.auth-wrap{max-width:440px;margin:3rem auto}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:2.4rem;box-shadow:var(--shadow-lg)}
.auth-card h1{text-align:center;font-size:1.9rem;margin-bottom:.3rem}
.auth-card .sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:1.6rem}
.f-row{margin-bottom:1.1rem}
.f-err{color:#C05555;font-size:.8rem;margin-top:.3rem;display:none}
.f-err.on{display:block}
.form-foot{margin-top:1.4rem}
.form-foot .btn{width:100%}
.auth-alt{text-align:center;margin-top:1.2rem;font-size:.9rem;color:var(--muted)}
.auth-alt a{color:var(--accent-deep);font-weight:700}
.setup-card{background:#FFF6E0;border:1.5px dashed #E3C87E;border-radius:var(--r-md);padding:1rem 1.2rem;margin-bottom:1.4rem;font-size:.85rem;color:#8A6B1E}
[data-theme="night"] .setup-card{background:#3A2F1A;color:#E8CE7E;border-color:#5A4A22}
/* ============================================================
   10) لوحة التحكم
============================================================ */

    if(window.crypto&&crypto.subtle){
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
      return 'sha256:'+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'fb:'+(h2>>>0).toString(16)+(h1>>>0).toString(16);
}

async function driveReachable(id){
  try{
    const c=new AbortController();const t=setTimeout(()=>c.abort(),9000);
    await fetch('https://drive.google.com/uc?export=open&id='+id,{mode:'no-cors',signal:c.signal,cache:'no-store'});
    clearTimeout(t);return true;
  }catch(e){return false;}
}
async function autoCheckDrive(){
  try{
    for(const b of db.books.filter(b=>b.fileType==='drive'&&b.status==='published'&&b.verified!=='ok')){
      const ok=await driveReachable(b.fileId);
      b.verified=ok?'ok':'error';
      if(!ok)logAct('تعذّر الوصول إلى ملف «'+b.title+'» — يلزم تعديل صلاحيات المشاركة');
    }
    save();
  }catch(e){}
}
function extractDriveId(url){
  if(!url)return null;
  const m=String(url).match(/file\/d\/([A-Za-z0-9_-]+)/)||String(url).match(/[?&]id=([A-Za-z0-9_-]+)/);
  return m?m[1]:null;
}

async function doRegister(name,email,pass){
  name=(name||'').trim();email=(email||'').trim().toLowerCase();
  if(name.length<3)return{ok:0,msg:'الاسم يجب أن يكون 3 أحرف على الأقل.'};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return{ok:0,msg:'يرجى إدخال بريد إلكتروني صحيح.'};
  if(!/(?=.*[A-Za-z])(?=.*\d).{8,}/.test(pass))return{ok:0,msg:'كلمة المرور: 8 أحرف على الأقل مع حرفٍ ورقم.'};
  if(db.users.some(u=>u.email===email))return{ok:0,msg:'هذا البريد مسجّلٌ بالفعل — جرّب تسجيل الدخول.'};
  const salt='s-'+uid();
  db.users.push({id:uid(),name,email,pass:await hashPw(pass,salt),salt,role:'reader',active:true,mustChange:false,fails:0,lockedUntil:0,createdAt:Date.now(),lastLogin:0});
  save();logAct('تسجيل حساب جديد: '+name);
  return{ok:1};
}
async function doLogin(email,pass){
  email=(email||'').trim().toLowerCase();
  const u=db.users.find(x=>x.email===email);
  if(!u||!u.active)return{ok:0,msg:'بيانات الدخول غير صحيحة.'};
  if(u.lockedUntil&&Date.now()<u.lockedUntil)return{ok:0,msg:'الحساب موقوف مؤقتًا — حاول بعد دقائق.',lock:u.lockedUntil};
  if(await hashPw(pass,u.salt)!==u.pass){
    u.fails=(u.fails||0)+1;
    if(u.fails>=5){u.lockedUntil=Date.now()+5*60*1000*(u.fails-4);logAct('توقيف مؤقت لحساب '+u.email+' بعد محاولات متكررة');}
    save();
    return{ok:0,msg:'بيانات الدخول غير صحيحة.',fails:u.fails};
  }
  u.fails=0;u.lastLogin=Date.now();save();
  localStorage.setItem(SES_KEY,u.id);
  logAct('تسجيل دخول: '+u.name);
  return{ok:1,user:u};
}
function doLogout(){localStorage.removeItem(SES_KEY);logAct('تسجيل خروج');toast('تم تسجيل الخروج — إلى اللقاء');go('#/);}
function sendReset(email){
  email=(email||'').trim().toLowerCase();
  const u=db.users.find(x=>x.email===email);
  if(!u)return{ok:1,msg:'إذا كان البريد مسجّلًا فستصلك رابط الاستعادة shortly.'};
  const token=uid()+uid();
  db.resets.push({token,email,exp:Date.now()+30*60*1000,used:false});
  save();
  return{ok:1,token,msg:'تم إنشاء رابط الاستعادة (عرض تجريبي — في الإنتاج يُرسل إلى بريدك).'};
}
function doReset(token,pass){
  const r=db.resets.find(x=>x.token===token&&!x.used&&x.exp>Date.now());
  if(!r)return{ok:0,msg:'الرابط غير صالح أو منتهٍ.'};
  if(!/(?=.*[A-Za-z])(?=.*\d).{8,}/.test(pass))return{ok:0,msg:'كلمة المرور: 8 أحرف على الأقل مع حرفٍ ورقم.'};
  const u=db.users.find(x=>x.email===r.email);
  if(u){u.salt='s-'+uid();u.pass=null;u.mustChange=false;/* يُعاد تجزئتها أدناه */}
  r.used=true;save();
  return{ok:1};
}
async function finalizeReset(token,pass){
  const r=db.resets.find(x=>x.token===token&&!x.used&&x.exp>Date.now());
  if(!r)return{ok:0,msg:'الرابط غير صالح أو منتهٍ.'};
  if(!/(?=.*[A-Za-z])(?=.*\d).{8,}/.test(pass))return{ok:0,msg:'كلمة المرور: 8 أحرف على الأقل مع حرفٍ ورقم.'};
  const u=db.users.find(x=>x.email===r.email);
  if(u){u.salt='s-'+uid();u.pass=await hashPw(pass,u.salt);u.mustChange=false;u.fails=0;}
  r.used=true;save();logAct('إعادة تعيين كلمة المرور لحساب '+(u?u.email:r.email));
  return{ok:1};
}

      <p><b>1. البيانات التي نجمعها:</b> نحتفظ فقط بالحدّ الأدنى اللازم لتشغيل حسابك: الاسم والبريد الإلكتروني وكلمة المرور (مجزّأة) ومفضلتك من الكتب. لا نجمع موقعك أو بيانات جهازك أو أي شيءٍ غير ذلك.</p>
      <p><b>2. ماذا لا نفعل أبدًا:</b> لا نبيع بياناتك ولا نشاركها مع أطرافٍ ثالثة ولا نستخدمها لأي غرضٍ غير تشغيل حسابك وتجربتك في المكتبة.</p>
      <p><b>3. خصوصية القراءة:</b> قائمة مفضلتك خاصة بحسابك وحده ولا تظهر للزوار.</p>
      <p><b>4. المحتوى:</b> جميع الكتب والأقوال تُضاف بإذنٍ رسميٍّ من الإدارة؛ إن كان لك حقٌّ في أي محتوى معروض فأخبرنا وسنراجعه فورًا.</p>
      <p><b>5. التخزين:</b> في هذه النسخة تُحفظ البيانات محليًا على جهازك؛ عند الانتقال إلى الخادم المركزي ستُحدَّث هذه السياسة بما يضمن الحماية الكاملة.</p>`
      :`
      <p><b>1. الاستخدام الصحيح:</b> تُستخدم المكتبة للاطلاع والقراءة فقط. يمنع إعادة نشر المحتوى أو تحميله دون إذنٍ كتابيٍّ من الإدارة.</p>
      <p><b>2. الحساب:</b> أنت مسؤول عن سرية حسابك وكلمة مرورك. يمنع إنشاء حسابات متعددة أو محاولة اختراق الحسابات الأخرى — أي محاولاتٍ متكررةٍ تُوقَّف مؤقتًا تلقائيًا.</p>
      <p><b>3. الصلاحيات:</b> الحسابات القرائية للتصفح والمفضلة فقط. النشر والتعديل والحذف محصورٌ بالمديرة ومساعدها المعتمد.</p>
      <p><b>4. المحتوى:</b> المكتبة لا تضمن دقة المحتوى المرفوع من مصادرٍ خارجية (كروابط Google Drive) وتُعرض كما هو بإذنٍ من صاحبه.</p>
      <p><b>5. التغييرات:</b> يحق للإدارة تعديل هذه الشروط أو إيقاف أي خدمةٍ دون إشعارٍ مسبق.</p>`}
    </div>
  </div></section>`;
}
function viewNotFound(){
  return `<section class="block"><div class="container"><div class="card empty reveal" style="padding:4rem"><div class="big">${I.search}</div><h2>الصفحة غير موجودة</h2><p>ربما نُقلت هذه الصفحة أو لم تُنشر بعد.</p><a class="btn btn-primary" href="#/">العودة للرئيسية</a></div></div></section>`;
}

function viewAdmin(tab){
  if(!curUser()){toast('يرجى تسجيل الدخول أولًا','warn');go('#/login');return'';}
  if(!isStaff())return viewNotFound();
  const u=curUser();
  const tabs=[['dashboard','لوحة التحكم',I.shield],['books','الكتب',I.book],['quotes','الأقوال',I.quote]];
  if(isOwner())tabs.push(['users','المستخدمون',I.users],['messages','الرسائل',I.msg],['settings','إعدادات الموقع',I.gear]);
  tabs.push(['logs','سجل العمليات',I.log]);
  let body='';
  if(tab==='dashboard'){
    const pub=db.books.filter(b=>b.status==='published').length;
    const q=db.quotes.filter(x=>x.status==='published').length;
    body=`<div class="stat-grid">
      <div class="stat-card"><b>${pub}</b><span>كتاب منشور</span></div>
      <div class="stat-card"><b>${db.books.length-pub}</b><span>كتاب مخفي</span></div>
      <div class="stat-card"><b>${q}</b><span>قولٌ منشور</span></div>
      <div class="stat-card"><b>${db.users.length}</b><span>حسابٌ مسجّل</span></div>
      <div class="stat-card"><b>${Object.values(db.favorites).flat().length}</b><span>مفضلة</span></div>
      <div class="stat-card"><b>${db.messages.length}</b><span>رسالة</span></div>
    </div>
    <div class="card" style="padding:1.6rem;margin-bottom:1.4rem"><h3 style="margin-bottom:.8rem">${I.log} أحدث العمليات</h3>
      ${db.activity.slice(0,8).map(a=>`<div style="display:flex;gap:.8rem;padding:.55rem 0;border-bottom:1px dashed var(--line);font-size:.9rem"><span style="color:var(--muted)">${fmtDate(a.at)}</span><b>${esc(a.by)}</b><span>${esc(a.act)}</span></div>`).join('')||'<p style="color:var(--muted)">لا توجد عمليات بعد.</p>'}
    </div>
    <div class="admin-note">${I.info} نسخة تجريبية: تُحفظ البيانات محليًا على هذا الجهاز (localStorage). للنشر الفعلي يلزم ربط خادمٍ وقاعدة بياناتٍ مركزية — راجع ملاحظات التسليم.</div>`;
  }
  if(tab==='books'){
    body=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem;margin-bottom:1.2rem">
      <p style="color:var(--muted)">${db.books.length} كتابًا في المكتبة</p>
      <button class="btn btn-primary" data-act="bk-new">${I.plus} إضافة كتاب</button></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الغلاف</th><th>العنوان</th><th>التصنيف</th><th>الحالة</th><th>الملف</th><th>إجراءات</th></tr></thead><tbody>
      ${db.books.map(b=>`<tr>
        <td><span class="mini-cover cv-${b.cover||'rose'}">${esc(b.title.slice(0,12))}</span></td>
        <td><b>${esc(b.title)}</b>${b.author?`<br><small style="color:var(--muted)">${esc(b.author)}</small>`:''}</td>
        <td><span class="chip chip-sky">${esc(b.category)}</span></td>
        <td>${b.status==='published'?'<span class="badge b-ok">منشور</span>':'<span class="badge b-hide">مخفي</span>'}</td>
        <td>${b.fileType==='drive'?(b.verified==='ok'?'<span class="badge b-ok">متاح</span>':b.verified==='error'?'<span class="badge b-err">تعذّر الوصول</span>':'<span class="badge b-pend">بانتظار التحقق</span>'):'<span class="badge b-ok">مرفوع</span>'}</td>
        <td><div class="row-acts">
          <button class="btn btn-sm btn-ghost" data-act="bk-edit" data-id="${b.id}">${I.edit} تعديل</button>
          <button class="btn btn-sm btn-ghost" data-act="bk-toggle" data-id="${b.id}">${b.status==='published'?I.eyeOff+' إخفاء':I.eye+' نشر'}</button>
          ${b.fileType==='drive'?`<button class="btn btn-sm btn-ghost" data-act="bk-verify" data-id="${b.id}" title="التحقق من الرابط">${I.refresh} تحقق</button>`:''}
          <button class="btn btn-sm btn-danger" data-act="bk-del" data-id="${b.id}">${I.trash}</button>
        </div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد كتب بعد — أضف أول كتابٍ من الزر أعلاه.</td></tr>'}
      </tbody></table></div>`;
  }
  if(tab==='quotes'){
    body=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem;margin-bottom:1.2rem">
      <p style="color:var(--muted)">${db.quotes.length} قولًا</p>
      <button class="btn btn-primary" data-act="q-new">${I.plus} إضافة قول</button></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>النص</th><th>المصدر</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>
      ${db.quotes.map(q=>`<tr><td style="max-width:340px">«${esc(q.text)}»</td><td>${esc(q.source||'—')}</td>
        <td>${q.status==='published'?'<span class="badge b-ok">منشور</span>':'<span class="badge b-hide">مخفي</span>'}</td>
        <td><div class="row-acts">
          <button class="btn btn-sm btn-ghost" data-act="q-edit" data-id="${q.id}">${I.edit}</button>
          <button class="btn btn-sm btn-ghost" data-act="q-toggle" data-id="${q.id}">${q.status==='published'?I.eyeOff:I.eye}</button>
          <button class="btn btn-sm btn-danger" data-act="q-del" data-id="${q.id}">${I.trash}</button>
        </div></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد أقوال بعد.</td></tr>'}
      </tbody></table></div>`;
  }
  if(tab==='users'){
    if(!isOwner())return viewNotFound();
    body=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem;margin-bottom:1.2rem">
      <p style="color:var(--muted)">${db.users.length} حسابًا مسجّلًا</p>
      <button class="btn btn-primary" data-act="u-new">${I.plus} إضافة حساب</button></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th><th>آخر دخول</th><th>إجراءات</th></tr></thead><tbody>
      ${db.users.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td dir="ltr">${esc(x.email)}</td>
        <td><span class="badge ${x.role==='owner'?'b-owner':x.role==='assistant'?'b-asst':'b-reader'}">${x.role==='owner'?'المديرة':x.role==='assistant'?'مساعد':'قارئ'}</span></td>

        <td>${x.lastLogin?fmtDate(x.lastLogin):'—'}</td>
        <td><div class="row-acts">
          ${x.role!=='owner'?`<button class="btn btn-sm btn-ghost" data-act="u-role" data-id="${x.id}">${I.shield} ${x.role==='assistant'?'إلغاء المساعدة':'جعله مساعدًا'}</button>`:''}
          ${x.role!=='owner'?`<button class="btn btn-sm btn-ghost" data-act="u-toggle" data-id="${x.id}">${x.active?'تعطيل':'تفعيل'}</button>
          <button class="btn btn-sm btn-danger" data-act="u-del" data-id="${x.id}">${I.trash}</button>`:'<small style="color:var(--muted)">حساب محمي</small>'}
        </div></td></tr>`).join('')}
      </tbody></table></div>
      <div class="admin-note">${I.info} المديرة (ملك أحمد سامي) لا يمكن تعطيلها أو حذفها أو سحب صلاحياتها. المساعد لا يستطيع إدارة المستخدمين.</div>`;
  }
  if(tab==='messages'){
    if(!isOwner())return viewNotFound();
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الاسم</th><th>البريد</th><th>الرسالة</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>
      ${db.messages.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td dir="ltr">${esc(m.email||'—')}</td><td style="max-width:300px">${esc(m.msg)}</td><td>${fmtDate(m.at)}</td>
        <td><div class="row-acts">${m.read?'<span class="badge b-ok">تمت القراءة</span>':`<button class="btn btn-sm btn-ghost" data-act="m-read" data-id="${m.id}">${I.check} قُرئت</button>`}
        <button class="btn btn-sm btn-danger" data-act="m-del" data-id="${m.id}">${I.trash}</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد رسائل بعد.</td></tr>'}
      </tbody></table></div>`;
  }
  if(tab==='settings'){
    if(!isOwner())return viewNotFound();
    const s=db.settings;
    body=`<div class="card" style="padding:2rem;max-width:720px">
      <form id="settingsForm">
        <div class="f-row"><label class="f">اسم الموقع</label><input class="input" name="siteName" value="${esc(s.siteName)}" required></div>

        <div class="f-row"><label class="f">نص صفحة «عن المكتبة»</label><textarea class="input" name="aboutText" rows="6">${esc(s.aboutText)}</textarea></div>
        <div class="f-row"><label class="f">لون التمييز</label><div style="display:flex;gap:.6rem;flex-wrap:wrap">${Object.entries(ACCENTS).map(([k,v])=>`<label style="cursor:pointer"><input type="radio" name="accent" value="${k}" ${s.accent===k?'checked':''} style="display:none"><span style="display:inline-block;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,${v[0]},${v[1]});border:3px solid ${s.accent===k?'#C9A24B':'transparent'};box-shadow:var(--shadow)"></span></label>`).join('')}</div></div>

        <div class="f-row"><label class="f">بريد التواصل (اختياري)</label><input class="input" name="email" type="email" value="${esc(s.email)}" dir="ltr"></div>
        <button class="btn btn-primary" type="submit">${I.check} حفظ الإعدادات</button>
      </form>

  if(tab==='logs'){
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الوقت</th><th>المنفّذ</th><th>العملية</th></tr></thead><tbody>
      ${db.activity.map(a=>`<tr><td>${fmtDate(a.at)}</td><td><b>${esc(a.by)}</b></td><td>${esc(a.act)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا يوجد سجل بعد.</td></tr>'}
      </tbody></table></div>`;
  }
  return `<section class="block"><div class="container"><div class="admin-wrap">

      <div class="a-brand">${logoSVG(34)} لوحة
